<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barinas TV - Transmisión Continua</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { background: #000; color: white; margin: 0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { width: 100%; max-width: 850px; background: #111; border-radius: 10px; overflow: hidden; position: relative; }
    video { width: 100%; aspect-ratio: 16/9; display: block; }
    .status-overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
    .dot { width: 8px; height: 8px; background: #ff0000; border-radius: 50%; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    #msg { color: #fff; text-transform: uppercase; font-weight: bold; }
    .reconnect-btn { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: #ff0000; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="status-overlay">
    <div class="dot"></div>
    <span id="msg">Conectando...</span>
  </div>
  
  <video id="video" controls autoplay muted playsinline></video>
  <button id="reconnect" class="reconnect-btn" onclick="reiniciarFlujo()">RECONECTAR SEÑAL</button>
</div>

<script>
  const video = document.getElementById('video');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('reconnect');
  const streamUrl = 'https://live20.bozztv.com/giatv/giatv-barinastv1234/barinastv1234/chunks.m3u8';
  
  let hls = null;
  let ultimaPosicion = -1;
  let segundosCongelado = 0;

  function iniciarStreaming() {
    if (hls) {
      hls.destroy();
    }

    if (Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        manifestLoadingMaxRetry: Infinity, // No rendirse nunca
        manifestLoadingRetryDelay: 500,
        liveDurationInfinite: true, // Ignorar si el servidor dice que dura 2 min
        liveSyncDurationCount: 2,   // Pegarse lo más posible al vivo
        maxBufferLength: 10,        // Mantener buffer pequeño para evitar lag
        appendErrorMaxRetry: 10
      });

      // El parámetro ?t evita que el navegador use una versión vieja del archivo
      hls.loadSource(streamUrl + '?t=' + Date.now());
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play();
        msg.innerText = "En Vivo";
        btn.style.display = 'none';
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          console.log("Error de red o media, reiniciando...");
          iniciarStreaming();
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Para Safari (iPhone/Mac)
      video.src = streamUrl;
    }
  }

  // --- EL MOTOR DE SUPERVIVENCIA ---
  // Este intervalo revisa el video cada segundo para ver si se detuvo
  setInterval(() => {
    if (video.paused) return; // Si el usuario puso pausa, no hacer nada

    if (video.currentTime === ultimaPosicion) {
      segundosCongelado++;
      
      if (segundosCongelado >= 3) {
        msg.innerText = "Recuperando señal...";
        console.warn("Señal pegada, forzando recarga...");
        
        // Intentamos saltar al final del buffer antes de reiniciar todo
        if (video.buffered.length > 0) {
            video.currentTime = video.buffered.end(video.buffered.length - 1) - 0.1;
        }
      }

      if (segundosCongelado >= 6) {
        // Si después de 6 segundos sigue pegado, reiniciamos el motor HLS
        segundosCongelado = 0;
        iniciarStreaming();
      }
    } else {
      segundosCongelado = 0;
      msg.innerText = "En Vivo";
      ultimaPosicion = video.currentTime;
    }

    // Si el video llega al supuesto "final" (porque el servidor envió mal la info)
    if (video.ended) {
        msg.innerText = "Reconectando flujo...";
        iniciarStreaming();
    }
  }, 1000);

  function reiniciarFlujo() {
    iniciarStreaming();
  }

  // Iniciar al cargar la página
  iniciarStreaming();

  // Desmutear al primer clic
  window.addEventListener('click', () => {
    video.muted = false;
  }, { once: true });

</script>
</body>
</html>
