<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARINAS TV - SEÑAL EN VIVO</title>
  <!-- Cargamos el motor Clappr que es más estable -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
  <style>
    body { background-color: #000; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
    #player { width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #000; box-shadow: 0 0 30px rgba(255,0,0,0.2); }
    
    /* Botón de inicio forzado para evitar la pantalla negra */
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; cursor: pointer; }
    .play-button { width: 80px; height: 80px; background: #ff0000; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; color: white; transition: 0.3s; box-shadow: 0 0 20px #ff0000; }
    #overlay:hover .play-button { transform: scale(1.1); }
    .text { color: white; margin-top: 20px; font-weight: bold; letter-spacing: 2px; }
  </style>
</head>
<body>

  <!-- Capa de inicio para forzar al navegador a conectar -->
  <div id="overlay" onclick="startPlayer()">
    <div class="play-button">▶</div>
    <div class="text">TOCA PARA VER EN VIVO</div>
  </div>

  <div id="player"></div>

  <script>
    var player;
    var streamUrl = "https://live20.bozztv.com/giatv/giatv-barinastv1234/barinastv1234/chunks.m3u8";

    function startPlayer() {
      // Ocultar la capa de inicio
      document.getElementById('overlay').style.display = 'none';

      // Configurar el reproductor
      player = new Clappr.Player({
        source: streamUrl,
        parentId: "#player",
        autoPlay: true,
        width: '100%',
        height: '100%',
        mimeType: "application/x-mpegURL",
        actualLiveTime: true,
        preload: 'auto',
        playback: {
          hlsjsConfig: {
            enableWorker: true,
            lowLatencyMode: false, // Desactivado para mayor estabilidad
            manifestLoadingMaxRetry: Infinity,
            manifestLoadingRetryDelay: 1000,
            levelLoadingMaxRetry: Infinity,
            // Esto es clave: saltar errores de segmento
            fragLoadingMaxRetry: 10,
          }
        },
        events: {
          // Si el video se detiene por error del servidor, lo reinicia solo
          onError: function(e) {
            console.log("Error detectado, reintentando...");
            player.configure({source: streamUrl + "?t=" + Date.now()});
            player.play();
          },
          onEnded: function() {
            console.log("Fin de lista, reconectando...");
            player.configure({source: streamUrl + "?t=" + Date.now()});
            player.play();
          }
        }
      });
    }

    // Monitoreo extra: si el video no avanza, forzar carga
    setInterval(function() {
        if (player && player.isPlaying()) {
            // Si el buffer se queda vacío, Clappr lo intenta recuperar solo, 
            // pero si pasan 10 segundos sin éxito, podemos forzarlo:
            if (player.core.mediaControl.container.playback.ext === '0:00') {
                 // Sigue en 0, esperando...
            }
        }
    }, 5000);
  </script>

</body>
</html>
