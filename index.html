<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barinas TV - Live Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { background: #000; color: white; margin: 0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    #player-container { width: 100%; max-width: 960px; aspect-ratio: 16/9; position: relative; background: #000; box-shadow: 0 0 50px rgba(0,0,0,1); }
    video { width: 100%; height: 100%; display: block; object-fit: contain; }
    .status-bar { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); padding: 10px; display: flex; justify-content: space-between; box-sizing: border-box; font-size: 12px; }
    .live-tag { color: #ff0000; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; background: #ff0000; border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    #msg { color: #aaa; }
  </style>
</head>
<body>

<div id="player-container">
  <video id="video" autoplay muted playsinline controls></video>
  <div class="status-bar">
    <div class="live-tag"><div class="dot"></div> EN VIVO</div>
    <div id="msg">Sincronizando señal...</div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const msg = document.getElementById('msg');
  const streamUrl = 'https://live20.bozztv.com/giatv/giatv-barinastv1234/barinastv1234/chunks.m3u8';
  
  let hls = null;
  let lastTime = -1;
  let stallCounter = 0;

  function loadPlayer() {
    if (hls) {
      hls.destroy();
      console.log("Reiniciando flujo por congelamiento...");
    }

    if (Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 0,
        manifestLoadingMaxRetry: Infinity,
        manifestLoadingRetryDelay: 500,
        fragLoadingMaxRetry: Infinity,
        fragLoadingRetryDelay: 500,
        liveSyncDurationCount: 2, // Empezar muy cerca del "ahora"
        liveMaxLatencyDurationCount: 5,
        maxBufferLength: 6
      });

      // El '?v=' engaña al servidor para que no nos de video viejo (cache)
      hls.loadSource(streamUrl + '?nocache=' + Date.now());
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {});
        msg.innerText = "Señal en línea";
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          loadPlayer(); // Reinicio instantáneo ante error fatal
        }
      });
    }
  }

  // MOTOR DE VIGILANCIA (Watchdog)
  // Revisa cada segundo si el video se movió. Si no, lo arregla.
  setInterval(() => {
    if (video.paused) return;

    if (video.currentTime === lastTime) {
      stallCounter++;
      msg.innerText = "Recuperando señal... (" + stallCounter + "s)";
      
      // Si el video lleva 3 segundos pegado, forzamos un salto al futuro
      if (stallCounter >= 3) {
        if (video.buffered.length > 0) {
          video.currentTime = video.buffered.end(video.buffered.length - 1) - 0.1;
        }
      }

      // Si lleva 6 segundos pegado, reiniciamos el motor HLS por completo
      if (stallCounter >= 6) {
        stallCounter = 0;
        loadPlayer();
      }
    } else {
      stallCounter = 0;
      msg.innerText = "Transmisión Estable";
    }
    lastTime = video.currentTime;
  }, 1000);

  // Iniciar por primera vez
  loadPlayer();

  // Activar sonido al primer clic (regla de navegadores)
  document.addEventListener('click', () => {
    video.muted = false;
    msg.innerText = "Audio activado";
  }, { once: true });

</script>
</body>
</html>
